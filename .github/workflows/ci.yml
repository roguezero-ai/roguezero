name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it imports node:sqlite). Node 20 makes
          # setup-node's `cache: pnpm` probe crash before any step runs.
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Golden-path demo (in-process MCP)
        run: node examples/protected-tool/dist/demo.js

      - name: Golden-path demo (real stdio transport)
        run: node examples/protected-tool/dist/agent.js

      # The plug-and-play claim: a stock MCP client, no RogueZero code, through the proxy.
      # If this breaks, the pitch is false, so it fails the build.
      - name: Golden-path demo (unmodified client via `roguezero connect`)
        run: node examples/protected-tool/dist/demo-connect.js

      # The "identity for agents that run without you" claim: an unattended agent renewed live
      # by the scheduler, then revoked and NOT resurrected. If this breaks, the positioning is
      # false, so it fails the build.
      - name: Unattended-agent demo (renew live → revoke → no resurrection)
        run: node examples/protected-tool/dist/demo-unattended.js

      # The kill switch has to survive leaving one machine: publish a signed list, then prove a
      # verifier honours it and refuses a replayed older one.
      - name: Signed revocation list round-trip
        run: pnpm vitest run packages/cli/src/publish.test.ts
