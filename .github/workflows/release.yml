name: Release

# Publishes @roguezero/* to npm when a version tag is pushed (e.g. v0.1.0).
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN
# secret, by design. The `id-token: write` permission below is what mints the
# short-lived credential, and it is also what lets npm attest build provenance.
#
# One-time setup, per package, before the first tag:
#   npm trust github @roguezero/<pkg> --file release.yml \
#     --repo roguezero-ai/roguezero --allow-publish
# (npm only accepts a trusted publisher on a package that already exists, so
# each name is bootstrapped once by hand.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gated on the `release` environment, which requires a human reviewer.
    # This tag trigger runs at whatever commit the tag points to, so branch
    # protection on main does not constrain it; the environment does. GitHub
    # withholds the OIDC token until the run is approved, and npm's trust
    # config pins this exact environment — so no approval, no publish.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 needs >= 22.13 (node:sqlite); the bundled npm must be
          # >= 11.5.1 for OIDC trusted publishing. 24.x satisfies both, so we
          # use the npm that ships with Node rather than installing npm@latest
          # — that floats ahead of the pinned Node and breaks the run.
          node-version: 24.16.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm supports OIDC trusted publishing
        run: |
          V="$(npm --version)"
          echo "npm $V"
          node -e '
            const need = [11, 5, 1];
            const got = process.argv[1].split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if (got[i] > need[i]) process.exit(0);
              if (got[i] < need[i]) {
                console.error(`npm ${process.argv[1]} is too old for OIDC trusted publishing (need >= ${need.join(".")})`);
                process.exit(1);
              }
            }
          ' "$V"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Golden-path demo
        run: node examples/protected-tool/dist/demo.js

      - name: Publish packages
        run: pnpm -r --filter "./packages/*" publish --access public --provenance --no-git-checks
