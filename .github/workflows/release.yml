name: Release

# Publishes @roguezero/* to npm when a version tag is pushed (e.g. v0.1.0).
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN
# secret, by design. The `id-token: write` permission below is what mints the
# short-lived credential, and it is also what lets npm attest build provenance.
#
# One-time setup, per package, before the first tag:
#   npm trust github @roguezero/<pkg> --file release.yml \
#     --repo roguezero-ai/roguezero --allow-publish
# (npm only accepts a trusted publisher on a package that already exists, so
# each name is bootstrapped once by hand.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Golden-path demo
        run: node examples/protected-tool/dist/demo.js

      - name: Publish packages
        run: pnpm -r --filter "./packages/*" publish --access public --provenance --no-git-checks
